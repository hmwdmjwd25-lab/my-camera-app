<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .camera-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: #000;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        #photo {
            width: 100%;
            height: auto;
            display: none;
            border-radius: 20px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .capture-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.5);
        }

        .capture-btn:active {
            transform: scale(0.95);
        }

        .capture-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .capture-btn:active::before {
            width: 50px;
            height: 50px;
        }

        .switch-btn, .download-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .switch-btn:hover, .download-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(180deg);
        }

        .hidden {
            display: none !important;
        }

        .retake-btn {
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .retake-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            display: none;
        }

        @media (max-width: 600px) {
            .video-wrapper {
                border-radius: 15px;
            }
            
            .capture-btn {
                width: 70px;
                height: 70px;
            }
            
            .capture-btn::before {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📷 التقاط صورة</h1>
    </div>

    <div class="camera-container">
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <img id="photo" alt="الصورة الملتقطة">
            <div class="loading" id="loading">جاري التحميل...</div>
        </div>

        <div class="controls" id="cameraControls">
            <button class="switch-btn" id="switchBtn" title="تبديل الكاميرا">🔄</button>
            <button class="capture-btn" id="captureBtn" title="التقاط"></button>
            <div style="width: 50px;"></div>
        </div>

        <div class="controls hidden" id="photoControls">
            <button class="retake-btn" id="retakeBtn">📷 التقاط صورة جديدة</button>
            <a id="downloadBtn" class="download-btn" title="تحميل" style="text-decoration: none; display: flex;">💾</a>
        </div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const photo = document.getElementById('photo');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const switchBtn = document.getElementById('switchBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const cameraControls = document.getElementById('cameraControls');
        const photoControls = document.getElementById('photoControls');
        const loading = document.getElementById('loading');

        let currentStream = null;
        let currentFacingMode = 'user'; // 'user' for front, 'environment' for back

        // بدء الكاميرا
        async function startCamera(facingMode = 'user') {
            try {
                loading.style.display = 'block';
                
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                currentFacingMode = facingMode;
                
                loading.style.display = 'none';
            } catch (err) {
                loading.style.display = 'none';
                alert('لا يمكن الوصول للكاميرا. تأكد من إعطاء الإذن: ' + err.message);
            }
        }

        // التقاط الصورة
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // عكس الصورة للكاميرا الأمامية
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/png');
            photo.src = imageData;
            downloadBtn.href = imageData;
            downloadBtn.download = `photo_${Date.now()}.png`;
            
            video.style.display = 'none';
            photo.style.display = 'block';
            cameraControls.classList.add('hidden');
            photoControls.classList.remove('hidden');
        });

        // إعادة التصوير
        retakeBtn.addEventListener('click', () => {
            photo.style.display = 'none';
            video.style.display = 'block';
            photoControls.classList.add('hidden');
            cameraControls.classList.remove('hidden');
        });

        // تبديل الكاميرا
        switchBtn.addEventListener('click', () => {
            const newMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(newMode);
        });

        // بدء التشغيل
        startCamera();
    </script>

</body>
</html>
